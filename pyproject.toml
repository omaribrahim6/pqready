[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pqready"
version = "0.1.0"
description = "Grade how ready a TLS endpoint is for post-quantum cryptography"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Omar Ibrahim" }]
dependencies = ["cryptography>=43"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pqready = "pqready.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lab: needs the Docker lab running (PQREADY_LAB=1)"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
