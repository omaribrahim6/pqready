services:
  nginx:
    image: nginx:alpine  # Alpine ships OpenSSL 3.5, which has ML-KEM and ML-DSA built in
    container_name: pqready-lab
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs:ro
    # Docker-published ports bypass UFW, so bind to loopback only.
    # Set LAB_BIND to a Tailscale IP to reach the lab from other tailnet devices.
    ports:
      - "${LAB_BIND:-127.0.0.1}:8443:8443"
      - "${LAB_BIND:-127.0.0.1}:8444:8444"
      - "${LAB_BIND:-127.0.0.1}:8445:8445"
      - "${LAB_BIND:-127.0.0.1}:8446:8446"
