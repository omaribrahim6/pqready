# Four TLS endpoints, one per rung of the migration ladder.
# Each page answers with the key-exchange group nginx negotiated ($ssl_curve).

worker_processes 1;
events { worker_connections 256; }

http {
    access_log /dev/stdout;
    default_type text/plain;

    # F: TLS 1.2 and older, legacy versions still on. Plenty of the internet looks like this.
    server {
        listen 8443 ssl;
        server_name legacy.lab;
        ssl_certificate     /certs/legacy.lab.pem;
        ssl_certificate_key /certs/legacy.lab.key;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers DEFAULT:@SECLEVEL=0;
        location / { return 200 "legacy: $ssl_protocol $ssl_curve\n"; }
    }

    # C: modern TLS 1.3, classical key exchange only.
    server {
        listen 8444 ssl;
        server_name classic.lab;
        ssl_certificate     /certs/classic.lab.pem;
        ssl_certificate_key /certs/classic.lab.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ecdh_curve X25519:prime256v1:secp384r1;
        location / { return 200 "classic: $ssl_protocol $ssl_curve\n"; }
    }

    # A+: hybrid ML-KEM first. The one-line migration this project is about.
    server {
        listen 8445 ssl;
        server_name hybrid.lab;
        ssl_certificate     /certs/hybrid.lab.pem;
        ssl_certificate_key /certs/hybrid.lab.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
        location / { return 200 "hybrid: $ssl_protocol $ssl_curve\n"; }
    }

    # A+ with quantum-safe authentication too: ML-KEM key exchange and an
    # ML-DSA-65 certificate chain. No browser trusts ML-DSA roots yet; this is
    # what the end state looks like.
    server {
        listen 8446 ssl;
        server_name fullpq.lab;
        ssl_certificate     /certs/fullpq.lab.pem;
        ssl_certificate_key /certs/fullpq.lab.key;
        ssl_protocols TLSv1.3;
        ssl_ecdh_curve X25519MLKEM768:SecP384r1MLKEM1024:X25519;
        location / { return 200 "fullpq: $ssl_protocol $ssl_curve\n"; }
    }
}
